name: Build A16 unsigned IPA
on:
  # A change to this workflow triggers the first optimized IPA build.
  push:
    branches: [master]
    paths: ['.github/workflows/a16-ipa.yml', 'a16/build_ipa.sh']
  workflow_dispatch:
    inputs:
      variant:
        description: Optimized build or upstream scheduling with identical profile and metrics
        type: choice
        options: [optimized, control]
        default: optimized
permissions:
  contents: read
concurrency:
  group: a16-ipa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      A16_BUILD_VARIANT: ${{ inputs.variant || 'optimized' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: Check optimized source
        run: dotnet run --project tests/A16.Regression/A16.Regression.csproj -c Release
      - run: python3 -m unittest discover -s a16/tests
      - name: Prepare control on disposable checkout
        if: inputs.variant == 'control'
        run: python3 a16/prepare_control.py
      - name: Compile and package
        run: bash a16/build_ipa.sh
      - name: Build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A16-build-logs
          path: a16/out/logs
          if-no-files-found: warn
      - name: Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX-A16-Lab-${{ inputs.variant || 'optimized' }}-unsigned
          path: |
            a16/out/*.ipa
            a16/out/*.ipa.sha256
          if-no-files-found: error
