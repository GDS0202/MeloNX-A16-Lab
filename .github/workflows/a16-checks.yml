name: A16 source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: Build complete managed core on Linux (not iOS NativeAOT)
        run: dotnet build src/Ryujinx.Library/Ryujinx.Library.csproj -c Release -m:1 -p:RuntimeIdentifiers=linux-x64 -p:RuntimeIdentifier=linux-x64 -p:PublishAot=false -p:UseNativeAOTRuntime=false -p:PublishTrimmed=false
      - run: dotnet run --project tests/A16.Regression/A16.Regression.csproj -c Release
      - name: Check compiled descriptor path for temporary arrays
        run: dotnet run --project tests/A16.Regression/A16.Regression.csproj -c Release --no-build -- --inspect-descriptors src/Ryujinx.Graphics.Vulkan/bin/Release/net10.0/linux-x64/Ryujinx.Graphics.Vulkan.dll
      - name: Verify portable SIMD path
        run: DOTNET_EnableAVX2=0 dotnet run --project tests/A16.Regression/A16.Regression.csproj -c Release --no-build
      - name: Verify scalar fallback
        run: DOTNET_EnableHWIntrinsic=0 dotnet run --project tests/A16.Regression/A16.Regression.csproj -c Release --no-build
      - run: python3 -m unittest discover -s a16/tests
      - run: git diff --check
  swift-syntax:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse all app Swift sources
        run: find src/MeloNX/MeloNX -name '*.swift' -print0 | xargs -0 xcrun swiftc -frontend -parse
      - name: Execute production Swift settings and protocol regressions
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library src/MeloNX/MeloNX/UI/Main/Settings/NativeSettingsManager.swift src/MeloNX/MeloNX/Common/SettingsOverlay.swift src/MeloNX/MeloNX/Common/EmulationStatistics.swift a16/tests_swift/SwiftSettingsChecks.swift -o /tmp/a16-swift-checks
          /tmp/a16-swift-checks
      - name: Type-check host feedback against the iOS SDK (no linking)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          header = Path('src/MeloNX/MeloNX/Core/MeloNX-Bridging-Header.h').read_text()
          declaration = next(line for line in header.splitlines() if line.startswith('void report_host_state('))
          Path('/tmp/a16-host-bridge.h').write_text('#include <stdint.h>\n' + declaration + '\n')
          PY
          xcrun swiftc -typecheck -swift-version 5 -target arm64-apple-ios16.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -import-objc-header /tmp/a16-host-bridge.h src/MeloNX/MeloNX/Common/HostRuntime.swift
  ios-compile:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: Compile and link iOS core and UI without packaging an IPA
        run: bash a16/check_ios_build.sh
      - name: Compiler logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A16-source-compiler-logs
          path: a16/out/logs
          if-no-files-found: warn
